<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e9eef6;
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
  .box{padding:40px}
  h1{font-size:72px;margin:0;background:linear-gradient(135deg,#4ea1ff,#31d0aa);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#a8b8ce;margin:14px 0 26px}
  a{color:#4ea1ff;text-decoration:none;border:1px solid rgba(255,255,255,.16);
    border-radius:10px;padding:10px 20px;display:inline-block}
  a:hover{border-color:#4ea1ff}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Page not found · 页面不存在</p>
    <a href="/">← Home · 返回首页</a>
  </div>
</body>
</html>
